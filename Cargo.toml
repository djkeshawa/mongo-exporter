[package]
name = "mongo-exporter"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full", "sync"] }
mongodb = "2.8"
clap = { version = "4.4", features = ["derive"] }
dialoguer = "0.11"
indicatif = "0.17"
console = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
anyhow = "1.0"
csv = "1.3"
rayon = "1.8"
flate2 = "1.0"
memmap2 = "0.9"
num_cpus = "1.16"
toml = "0.8"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
arrow = "53.0"
parquet = "53.0"
humansize = "2.1"