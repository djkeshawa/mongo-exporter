name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - name: Build
      run: cargo build --release
    - name: Create archive
      run: |
        cd target/release
        tar -czf ../../mongo-exporter-x86_64-unknown-linux-gnu.tar.gz mongo-exporter
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-binary
        path: mongo-exporter-x86_64-unknown-linux-gnu.tar.gz

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - name: Build
      run: cargo build --release
    - name: Create archive
      run: |
        cd target/release
        7z a ../../mongo-exporter-x86_64-pc-windows-msvc.zip mongo-exporter.exe
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-binary
        path: mongo-exporter-x86_64-pc-windows-msvc.zip

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - name: Build
      run: cargo build --release
    - name: Create archive
      run: |
        cd target/release
        tar -czf ../../mongo-exporter-x86_64-apple-darwin.tar.gz mongo-exporter
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos-binary
        path: mongo-exporter-x86_64-apple-darwin.tar.gz

  release:
    name: Create Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        merge-multiple: true
        path: ./release
    
    - name: Generate checksums
      run: |
        cd release
        sha256sum *.tar.gz *.zip > checksums.txt
        ls -la
        cat checksums.txt

    - name: Get tag name
      id: tag
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "tag=v0.1.0" >> $GITHUB_OUTPUT
        else
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        name: Release ${{ steps.tag.outputs.tag }}
        body: |
          ## MongoDB Export CLI ${{ steps.tag.outputs.tag }}
          
          ### Installation
          
          **One-line install:**
          ```bash
          curl -sSL https://raw.githubusercontent.com/djkeshawa/mongo-exporter/main/install.sh | bash
          ```
          
          **Manual download:**
          - **Linux**: `mongo-exporter-x86_64-unknown-linux-gnu.tar.gz`
          - **Windows**: `mongo-exporter-x86_64-pc-windows-msvc.zip`
          - **macOS**: `mongo-exporter-x86_64-apple-darwin.tar.gz`
          
          ### Quick Start
          ```bash
          # Extract and run
          tar -xzf mongo-exporter-*.tar.gz  # Linux/macOS
          ./mongo-exporter export --uri "mongodb://localhost:27017"
          ```
          
          Verify downloads with `checksums.txt`.
        files: |
          release/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}